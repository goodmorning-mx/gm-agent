name: CI
on:
  pull_request:
  push:
    branches: [dev, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # gm-mcp and gm-billing are private sibling modules. Their integration
      # test runs in the release workspace; this job validates gm-agent's
      # isolated package contract without requiring cross-repository secrets.
      - run: pip install --no-deps .
      - run: python -m compileall -q gm_agent
      - run: python -m unittest discover -s tests -p 'test_package_contract.py' -v
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm ci
      - run: npm --prefix .. run build
      - run: npm --prefix .. pack
      - name: Install and import packed package in a clean consumer
        run: |
          set -euo pipefail
          tarball="$(find "$GITHUB_WORKSPACE/frontend" -maxdepth 1 -name 'goodmorning-gm-agent-*.tgz' -print -quit)"
          consumer="$(mktemp -d)"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund react@18 react-dom@18 "$tarball"
          node --input-type=module -e "import('@goodmorning/gm-agent').then(m => { if (!m.AgentChat || !m.AgentLauncher) process.exit(1) })"
